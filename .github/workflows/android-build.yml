name: Build Android APK Package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Set up Java JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install NPM Dependencies
        run: npm install

      - name: Add & Copy Capacitor Android Platform
        run: |
          npx cap add android || true
          npx cap copy android

      - name: Build Android APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Native Android APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Nikon-Survey-Collector-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
